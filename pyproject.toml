[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "us-equity-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "Pillow>=10.4,<13", "pydantic>=2.9,<3", "requests>=2.32,<3", "pandas-market-calendars>=4.4,<6", "ta==0.11.0"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["research*"]
[tool.pytest.ini_options]
pythonpath = ["."]
